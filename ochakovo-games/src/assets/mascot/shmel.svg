<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 240" width="260" height="240">
  <!-- Шмель — маскот. Отличие от пчелы: круглое пушистое тело, светлый хвостик, хохолок. Плоский стиль, цвета палитры лендинга: янтарь #F6AE2D, тёмный квас #2A1A0B -->
  <title>Шмель</title>
  <defs>
    <clipPath id="body">
      <ellipse cx="112" cy="150" rx="78" ry="62"/>
    </clipPath>
  </defs>

  <g stroke="#2A1A0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Крылья (за телом) -->
    <g fill="#FFFDF8" fill-opacity=".85">
      <ellipse cx="78" cy="70" rx="30" ry="46" transform="rotate(-28 78 70)"/>
      <ellipse cx="122" cy="62" rx="28" ry="44" transform="rotate(14 122 62)"/>
    </g>
    <path d="M70 52 q6 18 6 34 M118 44 q-2 16 2 32" fill="none" stroke="#8F4A0E" stroke-width="3" stroke-opacity=".5"/>

    <!-- Лапки -->
    <path d="M78 206 l-6 18 M108 210 l0 18 M138 206 l6 18" fill="none"/>

    <!-- Тело в полоску -->
    <ellipse cx="112" cy="150" rx="78" ry="62" fill="#F6AE2D"/>
  </g>
  <g clip-path="url(#body)" fill="#2A1A0B">
    <path d="M20 80 h36 q-14 70 0 140 h-36 z" fill="#FFF0CF"/>
    <path d="M56 80 h14 q-14 70 0 140 h-14 q-14 -70 0 -140 z"/>
    <path d="M86 80 h28 q-12 70 0 140 h-28 q-12 -70 0 -140 z"/>
    <path d="M142 80 h26 q-10 70 0 140 h-26 q-10 -70 0 -140 z"/>
  </g>
  <!-- Блик-пушок -->
  <ellipse cx="122" cy="110" rx="22" ry="8" fill="#FFEDB0" opacity=".8"/>
  <ellipse cx="112" cy="150" rx="78" ry="62" fill="none" stroke="#2A1A0B" stroke-width="5"/>

  <g stroke="#2A1A0B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Усики -->
    <path d="M186 84 q-6 -30 -24 -42 M206 86 q10 -28 30 -34" fill="none"/>
    <circle cx="160" cy="40" r="7" fill="#2A1A0B"/>
    <circle cx="238" cy="51" r="7" fill="#2A1A0B"/>

    <!-- Хохолок -->
    <path d="M188 84 q-4 -16 8 -18 q-6 10 4 16 q2 -14 14 -12 q-8 6 -2 16" fill="#F6AE2D"/>

    <!-- Голова -->
    <circle cx="196" cy="126" r="46" fill="#FFC24D"/>
  </g>

  <!-- Лицо -->
  <ellipse cx="180" cy="120" rx="8" ry="11" fill="#2A1A0B"/>
  <ellipse cx="214" cy="120" rx="8" ry="11" fill="#2A1A0B"/>
  <circle cx="183" cy="115" r="3.2" fill="#FFFDF8"/>
  <circle cx="217" cy="115" r="3.2" fill="#FFFDF8"/>
  <ellipse cx="166" cy="140" rx="9" ry="6" fill="#E8743B" opacity=".55"/>
  <ellipse cx="228" cy="140" rx="9" ry="6" fill="#E8743B" opacity=".55"/>
  <path d="M184 142 q13 14 26 0" fill="none" stroke="#2A1A0B" stroke-width="5" stroke-linecap="round"/>
</svg>
